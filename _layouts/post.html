---
layout: default
---
<article>
  <h1 class="post-title">{{ page.title }}</h1>
  <p class="post-meta">
    {{ page.date | date: "%B %-d, %Y" }}
    {% if page.categories.size > 0 %}
      · {% for c in page.categories %}{{ c }}{% unless forloop.last %}, {% endunless %}{% endfor %}
    {% endif %}
  </p>
  <div class="post-content">
    {{ content }}
  </div>
</article>
